# Cloudflare Worker – Konfiguration
#
# Diese Datei ist beim Git-Deployment die maßgebliche Quelle: Cloudflare liest
# sie bei jedem Build aus dem Repository. Secrets (ADMIN_PASSWORD,
# SESSION_SECRET, RESEND_API_KEY …) bleiben davon unberührt und werden
# weiterhin im Dashboard gesetzt.

name = "hundeschule"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Im Dashboard gesetzte Klartext-Variablen (z. B. SITE_URL) beim Deploy behalten.
keep_vars = true

# Statische Dateien: CSS, Skripte, Schriften, Fotos und der Admin-Bereich.
# Cloudflare liefert sie direkt aus; der Worker läuft nur für alles Übrige.
[assets]
directory = "./public"

# ───────────────────────────────────────────────────────────────────────────
# Speicher für Inhalte (Preise, Termine, Kontaktdaten) und Formularanfragen.
#
# Das Binding steht hier bewusst nicht fest drin: scripts/prepare-kv.mjs sucht
# den KV-Namespace beim Deploy und trägt ihn automatisch ein. Dafür muss im
# Cloudflare-Dashboard unter Settings → Builds als Build command stehen:
#
#     node scripts/prepare-kv.mjs
#
# Wer es lieber fest verdrahtet, trägt die Namespace-ID hier ein – dann lässt
# das Skript die Datei unangetastet:
#
# [[kv_namespaces]]
# binding = "SITE_KV"
# id = "HIER_DIE_NAMESPACE_ID_EINTRAGEN"
#
# Ohne beides läuft die Website mit den Standardinhalten aus
# src/data/defaults.js; der Admin-Bereich kann dann nichts speichern.
# ───────────────────────────────────────────────────────────────────────────
