# Cloudflare Worker – Konfiguration
#
# Diese Datei ist die Wahrheit für das Deployment: Cloudflare liest sie bei
# jedem Build aus dem Repository. Bindings, die nur im Dashboard gesetzt sind,
# werden dabei überschrieben – der KV-Namespace muss deshalb hier stehen.
# Secrets (ADMIN_PASSWORD, SESSION_SECRET, RESEND_API_KEY …) bleiben davon
# unberührt und werden weiterhin im Dashboard gesetzt.

name = "hundeschule"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Im Dashboard gesetzte Klartext-Variablen (z. B. SITE_URL) beim Deploy behalten.
keep_vars = true

# Statische Dateien: CSS, Skripte, Schriften, Fotos und der Admin-Bereich.
# Cloudflare liefert sie direkt aus; der Worker läuft nur für alles Übrige.
[assets]
directory = "./public"

# Speicher für Inhalte (Preise, Termine, Kontaktdaten) und Formularanfragen.
# Die id steht im Dashboard unter Storage & Databases → KV → hundeschule-inhalte.
[[kv_namespaces]]
binding = "SITE_KV"
id = "HIER_KV_NAMESPACE_ID_EINTRAGEN" # lokal egal, wird nur beim echten Deploy gebraucht
